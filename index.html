<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V8 Multiplayer Voxel Game</title>
    
    <!-- CSS Link (Agli file mein banayenge) -->
    <link rel="stylesheet" href="style.css">

    <!-- Three.js Load Karne ke liye (Import Map) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Firebase SDK (Realtime Database ke liye) -->
    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Aapka Firebase Config
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyB-UdPysk2hYPf75cx8IAkJzivpbuCQcnc",
            authDomain: "v8-wala-engine-hai.firebaseapp.com",
            databaseURL: "https://v8-wala-engine-hai-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "v8-wala-engine-hai",
            storageBucket: "v8-wala-engine-hai.appspot.com",
            messagingSenderId: "67142036156",
            appId: "1:67142036156:web:dbc35b215283e1cff67eb9"
        };

        // Initialize Firebase
        const app = initializeApp(FIREBASE_CONFIG);
        const db = getDatabase(app);

        // Isko global bana rahe hain taaki main.js isko use kar sake
        window.firebaseDB = db;
        window.firebaseRef = ref;
        window.firebaseSet = set;
        window.firebaseOnValue = onValue;
        window.firebaseOnDisconnect = onDisconnect;
        
        console.log("Firebase Connected Successfully!");
    </script>
</head>
<body>

    <!-- 1. GAME CANVAS (Yahan 3D duniya render hogi) -->
    <div id="game-container"></div>

    <!-- 2. LOADING SCREEN -->
    <div id="loading-screen">
        <h1>V8 Engine</h1>
        <div class="loader"></div>
        <p>Connecting to server...</p>
    </div>

    <!-- 3. MAIN LOBBY (Nature View ke saath) -->
    <div id="lobby-screen">
        <div class="lobby-content">
            <h1>V8 Multiplayer</h1>
            <p>Enter your name to join the world</p>
            <input type="text" id="player-name-input" placeholder="Your Name..." maxlength="15" autocomplete="off">
            <button id="join-btn">PLAY MULTIPLAYER</button>
            <div id="server-status">Checking server...</div>
        </div>
    </div>

    <!-- 4. IN-GAME UI (HUD) -->
    <div id="ui-layer" class="hidden">
        <!-- Crosshair (Nishana lagane ke liye) -->
        <div id="crosshair">+</div>

        <!-- Player Stats -->
        <div id="player-stats">
            <div class="bar-container">
                <div id="health-bar" class="bar health"></div>
            </div>
            <div class="bar-container">
                <div id="hunger-bar" class="bar hunger"></div>
            </div>
        </div>

        <!-- Multiplayer Info (Online Players) -->
        <div id="multiplayer-info">
            <span id="ping-display">Ping: --</span>
            <span id="online-players">Players: 1</span>
        </div>

        <!-- Mobile Controls (Phone par dikhenge) -->
        <div id="mobile-controls">
            <!-- Left Side: Joystick -->
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>

            <!-- Right Side: Action Buttons -->
            <div id="action-buttons">
                <button class="action-btn" id="btn-jump">JUMP</button>
                <button class="action-btn" id="btn-mine">MINE</button>
                <button class="action-btn" id="btn-place">PLACE</button>
            </div>
        </div>

        <!-- Inventory (Neeche) -->
        <div id="hotbar">
            <div class="slot active"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>

        <!-- Chat Button -->
        <button id="chat-btn">💬</button>
    </div>

    <!-- MAIN JS SCRIPT -->
    <script type="module" src="main.js"></script>
</body>
</html>
